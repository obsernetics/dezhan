# Credentials the CSI driver uses to talk to dezhan (bucket create/delete on the
# controller, mount on the node). Use a read-write S3 credential.
apiVersion: v1
kind: Secret
metadata:
  name: dezhan-csi-credentials
  namespace: kube-system
type: Opaque
stringData:
  accessKeyID: "dezhanadmin"
  secretAccessKey: "change-me-0123456789abcdef"
  # Optional: overrides the StorageClass endpoint/region per credential.
  # endpoint: "http://dezhan.default.svc:8080"
  # region: "us-east-1"
