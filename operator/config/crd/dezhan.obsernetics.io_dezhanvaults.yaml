apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dezhanvaults.dezhan.obsernetics.io
spec:
  group: dezhan.obsernetics.io
  names:
    kind: DezhanVault
    listKind: DezhanVaultList
    plural: dezhanvaults
    singular: dezhanvault
    shortNames:
      - dv
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                image:
                  type: string
                  default: ghcr.io/obsernetics/dezhan:latest
                port:
                  type: integer
                  format: int32
                  default: 8080
                  minimum: 1
                  maximum: 65535
                storage:
                  anyOf:
                    - type: integer
                    - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                  default: 50Gi
                storageClassName:
                  type: string
                requireAuth:
                  type: boolean
                  default: true
                deleteQuorum:
                  type: integer
                  format: int32
                  minimum: 0
                secretName:
                  type: string
                serviceType:
                  type: string
                  default: ClusterIP
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                ready:
                  type: boolean
                endpoint:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
