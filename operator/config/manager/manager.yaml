apiVersion: v1
kind: Namespace
metadata:
  name: dezhan-system
  labels:
    app.kubernetes.io/name: dezhan-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dezhan-operator
  namespace: dezhan-system
  labels:
    app.kubernetes.io/name: dezhan-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dezhan-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dezhan-operator
    spec:
      serviceAccountName: dezhan-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/obsernetics/dezhan-operator:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          ports:
            - name: metrics
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
