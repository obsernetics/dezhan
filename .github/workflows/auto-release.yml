name: auto-release

# Cut a versioned release automatically, but only when it would actually ship
# something. v1.0.0 taught the lesson: a manual tag with no artifact change is
# noise. This job releases only when files that go into the binaries, the three
# container images, or the Helm chart have changed since the last tag, AND the
# proof/build gate (ci.yml) is green on the commit being released. It then calls
# the reusable release.yml and image.yml, so no personal access token is needed
# to chain the builds.
#
# Cadence: weekly (Mondays, after the dependency sweep), plus on demand. Manual
# runs can choose the bump level and may force a release.
on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [ patch, minor, major ]
        default: patch
      force:
        description: "Release even if no shipped files changed since the last tag"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.d.outputs.release }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether and what to release
        id: d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event.inputs.bump }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          [ -z "${BUMP:-}" ] && BUMP=patch

          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          [ -z "$latest" ] && latest="v0.0.0"
          base="${latest#v}"; base="${base%%[-+]*}"
          MA="${base%%.*}"; rest="${base#*.}"; MI="${rest%%.*}"; PA="${rest##*.}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          new="$MA.$MI.$PA"

          # Did anything that ships actually change since the last tag?
          if [ "$latest" = "v0.0.0" ]; then
            changed="initial release"
          else
            changed=$(git diff --name-only "$latest"..HEAD -- \
              server cli verifier storage vault auth trusted_core operator csi \
              Dockerfile operator/Dockerfile csi/Dockerfile deploy/charts dezhan.gpr \
              ':(exclude)**/*.md' || true)
          fi

          # Is the proof/build gate green on the commit we would release?
          ci=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=1" \
                 --jq '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo none)

          release=false
          reason=""
          if git rev-parse -q --verify "refs/tags/v${new}" >/dev/null; then
            reason="tag v${new} already exists"
          elif [ "$ci" != "success" ]; then
            reason="ci.yml on ${GITHUB_SHA:0:7} is '${ci}', not success"
          elif [ -n "$changed" ]; then
            release=true; reason="shipped files changed since ${latest}"
          elif [ "${FORCE:-false}" = "true" ]; then
            release=true; reason="forced (no shipped changes since ${latest})"
          else
            reason="no shipped files changed since ${latest}"
          fi

          {
            echo "release=$release"
            echo "version=$new"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## auto-release decision"
            echo ""
            echo "- last tag: \`$latest\`"
            echo "- candidate: \`v$new\` (bump: $BUMP)"
            echo "- ci.yml on \`${GITHUB_SHA:0:7}\`: \`$ci\`"
            echo "- decision: **$([ "$release" = true ] && echo RELEASE || echo skip)** ($reason)"
            if [ -n "$changed" ] && [ "$changed" != "initial release" ]; then
              echo ""
              echo "<details><summary>changed shipped files</summary>"
              echo ""; echo '```'; echo "$changed"; echo '```'; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "decision: release=$release version=v$new ($reason)"

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.decide.outputs.version }}
    secrets: inherit

  image:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.decide.outputs.version }}
    secrets: inherit
