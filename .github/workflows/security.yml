name: security

# Scheduled and per-change security scanning. Trivy scans the working tree for
# known-vulnerable dependencies, misconfigurations, and secrets, and reports to
# the repository's Security tab (SARIF). It runs daily so a newly disclosed CVE
# in an otherwise-unchanged dependency surfaces within a day, not at the next
# push. go-module vulnerability scanning (govulncheck) lives in deps.yml.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
