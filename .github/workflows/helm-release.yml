name: helm-release

# Package the Helm chart and publish it as a chart repository on GitHub Pages,
# so users can `helm repo add dezhan https://obsernetics.github.io/dezhan`.
# Requires Pages to be enabled with source "GitHub Actions" (Settings > Pages).
on:
  push:
    branches: [ main ]
    paths: [ "deploy/charts/**", "deploy/helm-index.html", ".github/workflows/helm-release.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Package chart and build the repo index
        run: |
          BASE="https://obsernetics.github.io/dezhan"
          mkdir -p public
          helm package deploy/charts/dezhan -d public
          helm repo index public --url "$BASE"
          cp deploy/helm-index.html public/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
