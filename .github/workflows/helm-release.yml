name: helm-release

# Publish the project landing page AND the Helm chart repository to GitHub Pages
# at https://obsernetics.github.io/dezhan/ . The chart index.yaml stays at the
# site root so `helm repo add dezhan https://obsernetics.github.io/dezhan` keeps
# working. Requires Pages source "GitHub Actions" (Settings > Pages).
on:
  push:
    branches: [ main ]
    paths:
      - "deploy/charts/**"
      - "deploy/site/**"
      - "docs/assets/demo.gif"
      # The page content is generated from these sources, so a change to any of
      # them must republish the site (scripts/gen-site.py injects their values).
      - "bench/results/**"
      - "README.md"
      - "scripts/gen-site.py"
      - ".github/workflows/helm-release.yml"
  # A release changes the version the site tells people to install.
  release:
    types: [ published ]
  # Weekly, so a source that changed without matching a path filter - or a
  # deploy that failed and was forgotten - is corrected within seven days.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Full history + tags: the generator reads the latest git tag as the
      # authoritative release version to stamp into the page.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Build the site and the chart repo index
        run: |
          BASE="https://obsernetics.github.io/dezhan"
          mkdir -p public/assets
          # 1) Helm chart repository at the site root (keeps the repo add URL).
          helm package deploy/charts/dezhan -d public
          helm repo index public --url "$BASE"
          # 2) Landing page assets (css/js/icon), then the demo GIF and the
          #    dashboard screenshot.
          cp -r deploy/site/. public/
          cp docs/assets/demo.gif public/assets/demo.gif
          cp docs/assets/dashboard.png public/assets/dashboard.png
          # 3) Generate index.html from the repo's own sources so the published
          #    page can never drift: throughput from bench/results, the proof
          #    count from the README, the version from the latest git tag. The
          #    generator also cache-busts css/js with the commit sha.
          REV="${GITHUB_SHA::12}"
          python3 scripts/gen-site.py \
            --template deploy/site/index.html \
            --cache-bust "$REV" \
            --output public/index.html
          # 4) Cache-bust the image assets too, so an updated GIF or screenshot
          #    is never masked by a browser holding the old copy at the same URL.
          sed -i \
            -e "s#assets/demo.gif#assets/demo.gif?v=$REV#g" \
            -e "s#assets/dashboard.png#assets/dashboard.png?v=$REV#g" \
            public/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
