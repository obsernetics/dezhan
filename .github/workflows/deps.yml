name: deps

# Dependency health for the Go modules (operator, csi):
#   - govulncheck: scan for known vulnerabilities in the code's actual
#     dependency closure. Runs weekly too, so a newly disclosed CVE in an
#     unchanged dependency is caught even without a Dependabot PR.
#   - go mod tidy check: fail if go.mod/go.sum are not in their tidy canonical
#     form, so a hand-merged or drifted module manifest cannot land.
on:
  push:
    branches: [ main ]
    paths: [ "operator/**", "csi/**", ".github/workflows/deps.yml" ]
  pull_request:
    paths: [ "operator/**", "csi/**", ".github/workflows/deps.yml" ]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ operator, csi ]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  tidy:
    name: go mod tidy check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ operator, csi ]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Verify module downloads
        run: go mod verify
      - name: go.mod / go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in ${{ matrix.module }}/ and commit."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
