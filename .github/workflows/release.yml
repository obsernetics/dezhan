name: release

# Build statically-linked binaries, package the Helm chart at the release
# version, generate a CycloneDX SBOM, and publish a GitHub Release with an
# automatically generated changelog. Container images are published at the same
# version by image.yml.
#
# Two ways in: a manual `v*` tag push, or a reusable call from auto-release.yml
# (which passes the computed version and only fires when the shipped artifacts
# actually changed and CI is green).
on:
  push:
    tags: [ "v*" ]
  workflow_call:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.0.1). Empty = take it from the pushed tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Resolve version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VER"

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Provision toolchain
        run: |
          alr -n toolchain --select gnat_native gprbuild
          for d in "$HOME"/.local/share/alire/toolchains/*/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done

      - uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Build release binaries
        run: |
          gprbuild -p -P dezhan.gpr -cargs -O2
          mkdir -p dist
          cp server/obj/dezhan_server cli/obj/dezhan_cli verifier/obj/dezhan_verify dist/
          ( cd dist && sha256sum * > SHA256SUMS )

      - name: Package Helm chart at the release version
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          helm package deploy/charts/dezhan --version "$VER" --app-version "$VER" -d dist

      - name: Generate SBOM
        run: sh scripts/sbom.sh "${{ steps.ver.outputs.ver }}" > dist/dezhan.cdx.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: v${{ steps.ver.outputs.ver }}
          generate_release_notes: true   # automatic changelog from commits/PRs
          files: |
            dist/dezhan_server
            dist/dezhan_cli
            dist/dezhan_verify
            dist/SHA256SUMS
            dist/dezhan.cdx.json
            dist/dezhan-*.tgz
