name: release

# On a v* tag: build statically-linked binaries, package the Helm chart at the
# tag version, generate a CycloneDX SBOM, and publish a GitHub Release with an
# automatically generated changelog. The container images are published at the
# same version by image.yml (semver tags). The SPARK proof gate (ci.yml) should
# already be green for the commit being tagged.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for changelog generation

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Provision toolchain
        run: |
          alr -n toolchain --select gnat_native gprbuild
          for d in "$HOME"/.local/share/alire/toolchains/*/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done

      - uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Build release binaries
        run: |
          gprbuild -p -P dezhan.gpr -cargs -O2
          mkdir -p dist
          cp server/obj/dezhan_server cli/obj/dezhan_cli verifier/obj/dezhan_verify dist/
          ( cd dist && sha256sum * > SHA256SUMS )

      - name: Package Helm chart at the release version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          helm package deploy/charts/dezhan --version "$VER" --app-version "$VER" -d dist

      - name: Generate SBOM
        run: sh scripts/sbom.sh "${GITHUB_REF_NAME#v}" > dist/dezhan.cdx.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true   # automatic changelog from commits/PRs
          files: |
            dist/dezhan_server
            dist/dezhan_cli
            dist/dezhan_verify
            dist/SHA256SUMS
            dist/dezhan.cdx.json
            dist/dezhan-*.tgz
