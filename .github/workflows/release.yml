name: Release

# Builds the static binaries on a version tag and generates SLSA3 build
# provenance for them using the official SLSA GitHub generator.

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Alire
        uses: alire-project/setup-alire@v4

      - name: Install GNAT and GPRbuild toolchain
        run: alr -n toolchain --select gnat_native gprbuild

      - name: Build binaries
        run: |
          set -euxo pipefail
          for d in "$HOME"/.local/share/alire/toolchains/*/bin; do
            export PATH="$d:$PATH"
          done
          gprbuild -p -P server/dezhan_server.gpr
          gprbuild -p -P cli/dezhan_cli.gpr
          mkdir -p dist
          cp server/obj/dezhan_server dist/dezhan-server
          cp cli/obj/dezhan_cli dist/dezhan-cli

      - name: Generate subject hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum dezhan-server dezhan-cli | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dezhan-binaries
          path: dist/
          if-no-files-found: error

  provenance:
    name: Generate SLSA3 provenance
    needs: [build]
    permissions:
      actions: read       # read the workflow run for provenance
      id-token: write     # mint the OIDC token for signing
      contents: write     # attach the provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
