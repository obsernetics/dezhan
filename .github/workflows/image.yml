name: image

# Build and publish the server and operator container images to GHCR so the
# curl|sh installer (docker pull) and the Kubernetes manifests resolve.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_call:
    inputs:
      version:
        description: "Version to tag the images with (e.g. 1.0.1). Set by auto-release.yml."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dezhan
            context: .
            dockerfile: Dockerfile
          - image: dezhan-operator
            context: operator
            dockerfile: operator/Dockerfile
          - image: dezhan-csi
            context: csi
            dockerfile: csi/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Stamp the version into the sources for a versioned build (a reusable
      # call from auto-release, or a manual v* tag push) so the image reports
      # its real version. Plain main pushes (the `latest` image) are left as-is.
      - name: Resolve version to stamp
        id: sv
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Stamp the release version into the sources
        if: steps.sv.outputs.ver != ''
        run: sh scripts/stamp-version.sh "${{ steps.sv.outputs.ver }}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
