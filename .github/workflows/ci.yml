name: ci

on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: the job only needs to read the repo contents.
permissions:
  contents: read

# Cancel any in-progress run for the same ref when a newer commit arrives, so
# rapid pushes do not pile up redundant ~20 min proof jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build the product, run every unit test, measure trusted-core coverage, and as
# a hard gate run the SPARK proof. The job fails if gnatprove reports a single
# unproved check, so the mandatory immutability invariants stay machine-proved
# on every commit.
jobs:
  verify:
    name: build / prove / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      # Cache the Alire-managed GNAT/GPRbuild toolchain and the installed
      # gnatprove so the provision step is a fast no-op on a warm cache instead
      # of re-downloading the toolchain every run. Bump the "v1" suffix to force
      # a rebuild of the cache.
      - name: Cache Alire toolchain and GNATprove
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/alire
            ~/.alire
          key: alire-${{ runner.os }}-v1
          restore-keys: |
            alire-${{ runner.os }}-

      - name: Provision toolchain and GNATprove
        run: |
          alr -n toolchain --select gnat_native gprbuild
          alr -n install gnatprove
          # Put the Alire-managed GNAT, GPRbuild, gcov, and gnatprove on PATH
          # for every later step.
          for d in "$HOME"/.local/share/alire/toolchains/*/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          gnat --version | head -1
          gprbuild --version | head -1
          gnatprove --version | head -1

      # gnatprove caches proved verification conditions keyed on their content,
      # so a warm session reproves only what changed. A cold proof of the core
      # takes many minutes; this keeps subsequent runs fast without weakening
      # the gate (changed sources invalidate their VCs and are reproved).
      - name: Cache gnatprove session
        uses: actions/cache@v6
        with:
          path: trusted_core/obj/gnatprove
          key: gnatprove-${{ runner.os }}-v1-${{ hashFiles('trusted_core/src/**', 'trusted_core/dezhan_trusted_core.gpr', 'scripts/prove.sh') }}
          restore-keys: |
            gnatprove-${{ runner.os }}-v1-
            gnatprove-${{ runner.os }}-
            gnatprove-

      - name: SPARK proof gate (hard)
        run: sh scripts/prove.sh

      - name: Build and unit tests
        run: sh scripts/test.sh

      - name: Trusted-core coverage gate
        env:
          COVERAGE_MIN: "90"
        run: sh scripts/coverage.sh
